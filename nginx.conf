server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        image/svg+xml;

    # Хешированные ассеты Vite можно кешировать надолго.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # SPA: любой неизвестный путь отдаём как index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html не кешируется, чтобы обновления подхватывались сразу.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
